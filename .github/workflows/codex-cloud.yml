name: Codex↔Cloud Connector

on:
  workflow_dispatch:
    inputs:
      vm:
        description: "VM ID"
        required: true
      allow_from:
        description: "Optional IP or CIDR /32"
        required: false
      dry_run:
        description: "true|false (default true)"
        required: false
        default: "true"
  issue_comment:
    types: [created, edited]

permissions:
  actions: write
  issues: write
  pull-requests: write
  contents: read
  id-token: write

concurrency:
  group: codex-cloud-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  codex-cloud:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@codex') &&
       contains(github.event.comment.body, 'cloud') &&
       contains(github.event.comment.body, 'fix-metadata'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      DISPATCH_VM: ${{ inputs.vm }}
      DISPATCH_ALLOW_FROM: ${{ inputs.allow_from }}
      DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
      YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      YC_SA_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
      YC_SG_ID: ${{ secrets.YC_SG_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run connector
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .github/scripts/codex-cloud.sh
          .github/scripts/codex-cloud.sh
